name: CI

on:
  push:
    branches:
      - main
      - Assignment2-bhanu
  pull_request:
    branches:
      - main

jobs:
  quality-and-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Check formatting with Black
        run: |
          black --check config.py services utils ui api tests

      - name: Check imports with isort
        run: |
          isort --check-only config.py services utils ui api tests

      - name: Run Flake8
        run: |
          flake8 config.py services utils ui api tests

      - name: Run pytest
        run: |
          pytest -v